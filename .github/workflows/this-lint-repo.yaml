---
name: Run Repository Linting
on:
  push:
    branches:
      - main
      - feature/*
      - fix/*
  pull_request:
    branches:
      - main
      - feature/*
      - fix/*

jobs:
  Lint-Repository:
    uses: ./.github/workflows/call-repository-linting.yaml  # TEMP test of #227, revert before merge
    with:
      runs-on: ubuntu-latest
      environment-name: linting
      app-directory: "./"
      output-file: "/tmp/github-workflow-templates-findings.txt"
      continue-error: "true"
      dagger-version: v0.19.3  # TEMP test of #227 guard, revert before merge
      # renovate: datasource=github-releases depName=stuttgart-things/blueprints
      dagger-module-version: v3.11.0
      branch-name: ${{ github.head_ref || github.ref_name }}
    secrets: inherit # pragma: allowlist secret
