---
name: Ansible collection build
on:
  workflow_call:
    inputs:
      runs-on:
        required: false
        type: string
        default: dagger
      collection-directory:
        required: true
        type: string
      branch-name:
        required: false
        default: main
        type: string
      dagger-version:
        required: false
        type: string
        default: v0.21.7
      dagger-module-version:
        required: false
        type: string
        default: v0.121.0
      environment-name:
        required: false
        type: string
        default: k8s
      publish-release:
        description: >-
          Publish the built collection as a github release. Set false on
          pull_request builds so only merges to the default branch release.
        required: false
        type: boolean
        default: true

jobs:
  collection-build:
    outputs:
      collection-name: ${{ steps.meta.outputs.COLLECTION_PACKAGE_NAME }}
      collection-tag: ${{ steps.meta.outputs.COLLECTION_TAG }}
    name: Collection Build
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment-name }}
    # THE BUILD READS SOURCE AND UPLOADS AN ARTIFACT. IT RELEASES NOTHING, SO
    # IT NEEDS NO WRITE SCOPE ON THE CALLING REPOSITORY
    permissions:
      contents: read
    steps:
      - name: Checkout Project
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: '0'
          ref: ${{ inputs.branch-name }}

      - name: Determine Collection Version
        id: version
        run: |
          set -eu

          # THE COMMIT COUNT IS THE ORDERING SIGNAL. A SHALLOW CLONE RETURNS A
          # SMALL COUNT AND WOULD SILENTLY PUBLISH A LOWER VERSION THAN THE
          # LAST RELEASE, SO REFUSE TO GUESS
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "repository is shallow - checkout needs fetch-depth: 0"
            exit 1
          fi

          # YY.MMDD.<COMMIT COUNT>: MONOTONIC ACROSS DAY, MONTH AND YEAR
          # BOUNDARIES, AND THE PATCH TIES A RELEASE TO AN EXACT COMMIT
          VERSION="$(date -u +%y).$(date -u +%-m%d).$(git rev-list --count HEAD)"

          echo "COLLECTION VERSION: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build Collection
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ inputs.dagger-version }}
          verb: call
          args: run-collection-build-pipeline --src ${{ inputs.collection-directory }} --version ${{ steps.version.outputs.version }} --progress plain export --path=/tmp/${{ inputs.collection-directory }}
          module: github.com/stuttgart-things/dagger/ansible@${{ inputs.dagger-module-version }}

      - name: Check collection artifact
        id: meta
        run: |
          COLLECTION_PACKAGE_PATH=$(ls --time=birth /tmp/${{ inputs.collection-directory }}/*.tar.gz | head -n 1)
          COLLECTION_PACKAGE_NAME=$(basename "${COLLECTION_PACKAGE_PATH}")

          # THE TAG NAMES A VERSION, NOT A FILE - THE EXTENSION BELONGS TO THE
          # RELEASE ASSET ONLY
          COLLECTION_TAG=$(basename "${COLLECTION_PACKAGE_PATH}" .tar.gz)

          echo ${COLLECTION_PACKAGE_NAME}
          echo ${COLLECTION_PACKAGE_PATH}
          echo ${COLLECTION_TAG}

          echo "COLLECTION_PACKAGE_NAME=$(echo ${COLLECTION_PACKAGE_NAME})" >> $GITHUB_ENV
          echo "COLLECTION_PACKAGE_NAME=$(echo ${COLLECTION_PACKAGE_NAME})" >> $GITHUB_OUTPUT
          echo "COLLECTION_PACKAGE_PATH=$(echo ${COLLECTION_PACKAGE_PATH})" >> $GITHUB_ENV
          echo "COLLECTION_TAG=$(echo ${COLLECTION_TAG})" >> $GITHUB_OUTPUT
        shell: bash

      - name: Upload collection
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.COLLECTION_PACKAGE_NAME }}
          path: ${{ env.COLLECTION_PACKAGE_PATH }}

     # - name: Send Message To Homerun
     #   if: always()
     #   uses: stuttgart-things/github-workflow-templates/actions/send-homerun-message@main
     #   with:
     #     url: "https://homerun.homerun-dev.sthings-vsphere.labul.sva.de/generic"
     #     secretToken: "${{ secrets.HOMERUN_TOKEN }}"
     #     title: "[ANSIBLE][COLLECTION] ${{ env.COLLECTION_PACKAGE_NAME }} build"
     #     message: "COMMIT: ${{ github.event.head_commit.message }} BRANCH: ${{ github.head_ref || github.ref_name }} REPO: https://github.com/${GITHUB_REPOSITORY}"
     #     severity: "INFO"
     #     artifacts: "${{ env.COLLECTION_PACKAGE_NAME }}"
     #     tags: "github,ansible,collection"
     #     assigneeName: "${GITHUB_ACTOR}"

  Release-Collection:
    needs: collection-build
    if: ${{ inputs.publish-release }}
    # PASSED DOWN TO call-release-artifact.yaml, WHICH SIGNS A BUILD PROVENANCE
    # ATTESTATION. A REUSABLE WORKFLOW CANNOT GRANT ITSELF MORE THAN ITS CALLER
    # DID, SO THE CALLING REPOSITORY MUST GRANT THESE TOO
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-release-artifact.yaml@80a37e2b85ef8a3ed714d8e9c5f96625393c92ba # main
    with:
      runs-on: ${{ inputs.runs-on }}
      environment-name: k8s
      dagger-module-version: ${{ inputs.dagger-module-version }}
      artifact-name: ${{ needs.collection-build.outputs.collection-name }}
      tag: ${{ needs.collection-build.outputs.collection-tag }}
      dagger-version: ${{ inputs.dagger-version }}
    secrets: inherit # pragma: allowlist secret
