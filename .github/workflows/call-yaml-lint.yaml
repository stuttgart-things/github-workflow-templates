---
name: Lint yaml files
on:
  workflow_call:
    inputs:
      runs-on:
        required: true
        type: string
      environment-name:
        default: k8s
        required: true
        type: string
      continue-error:
        default: false
        required: true
        type: boolean
      lintprofile-path:
        default: .yamllint
        type: string
      yamllint-version:
        default: 1
        type: string
      artifact-name:
        default: yaml-lint
        type: string

jobs:
  Yaml-Lint:
    runs-on: ${{ inputs.runs-on }}
    container:
      image: cytopia/yamllint:${{ inputs.yamllint-version }}
    environment: ${{ inputs.environment-name }}
    continue-on-error: ${{ inputs.continue-error }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'

      - name: Run yaml lint
        run: |
          ls -lta
          yamllint . --format github -c ${{ inputs.lintprofile-path }} | tee ./${{ inputs.artifact-name }}.txt
          echo "Warnings: $(grep -c "Warning" ./${{ inputs.artifact-name }}.txt)"
          echo "Errors: $(grep -c "Error" ./${{ inputs.artifact-name }}.txt)"

      - name: Upload linting results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-name }}.txt
