---
name: Release artifact
on:
  workflow_call:
    inputs:
      runs-on:
        required: false
        type: string
        default: dagger
      artifact-name:
        required: true
        type: string
      tag:
        description: >-
          Release tag. Defaults to artifact-name, which embeds the file
          extension - pass this to tag a version rather than a filename.
        required: false
        type: string
        default: ''
      environment-name:
        required: false
        type: string
        default: k8s
      dagger-module-version:
        required: false
        type: string
        default: v0.121.0
      dagger-version:
        required: false
        type: string
        default: v0.21.9

jobs:
  release-artifact:
    name: Release artifact on github
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment-name }}
    # THE CALLER MUST GRANT THESE OR attest-build-provenance FAILS. id-token
    # SIGNS THE ATTESTATION VIA OIDC, attestations WRITES IT TO THE CALLING
    # REPOSITORY'S ATTESTATION STORE
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: |-
            /tmp

      - name: Verify artifact
        run: |
          du -sh /tmp/${{ inputs.artifact-name }}
        shell: bash

      # CONSUMERS ansible-galaxy install FROM A PLAIN HTTPS URL WITH NOTHING TO
      # CHECK THE DOWNLOAD AGAINST. PUBLISH THE DIGEST AS A RELEASE ASSET SO
      # THERE IS SOMETHING TO VERIFY AGAINST
      - name: Generate Checksum
        id: checksum
        run: |
          set -eu
          cd /tmp
          sha256sum "${{ inputs.artifact-name }}" > "${{ inputs.artifact-name }}.sha256"
          cat "${{ inputs.artifact-name }}.sha256"

          DIGEST=$(cut -d' ' -f1 < "${{ inputs.artifact-name }}.sha256")
          echo "sha256=${DIGEST}" >> "$GITHUB_OUTPUT"
        shell: bash

      # BINDS THE ARTIFACT TO THE WORKFLOW, REPOSITORY AND COMMIT THAT PRODUCED
      # IT. VERIFY WITH:
      #   gh attestation verify <file> \
      #     --repo <owner>/<repo> \
      #     --signer-repo stuttgart-things/github-workflow-templates
      #
      # --signer-repo IS NOT OPTIONAL. THE SIGNING IDENTITY IN THE CERTIFICATE
      # IS THIS REUSABLE WORKFLOW, WHICH LIVES IN A DIFFERENT REPOSITORY FROM
      # THE ARTIFACT. WITHOUT IT gh LOOKS FOR A SIGNER IN THE ARTIFACT'S OWN
      # REPO, FINDS NONE, AND FAILS WITH A BARE
      #   Error: verifying with issuer "sigstore.dev"
      # WHICH READS LIKE A BAD ARTIFACT RATHER THAN A BAD COMMAND
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: /tmp/${{ inputs.artifact-name }}

      - name: Refuse To Republish An Existing Tag
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || inputs.artifact-name }}
        run: |
          set -eu

          # A VERSION IS DERIVED FROM THE COMMIT, SO AN EXISTING TAG MEANS THIS
          # EXACT SOURCE WAS ALREADY RELEASED. FAIL HERE WITH SOMETHING READABLE
          # RATHER THAN LETTING THE RELEASE STEP COLLIDE
          HTTP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")

          case "${HTTP_CODE}" in
            404)
              echo "tag ${RELEASE_TAG} is free"
              ;;
            200)
              echo "tag ${RELEASE_TAG} already exists"
              echo "this commit was already released - commit a change to release again"
              exit 1
              ;;
            *)
              echo "could not check tag ${RELEASE_TAG}: HTTP ${HTTP_CODE}"
              exit 1
              ;;
          esac
        shell: bash

      - name: Release Collection
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ inputs.dagger-version }}
          verb: call
          args: github-release --token=env:GH_TOKEN --group ${GITHUB_REPOSITORY%%/*} --repo ${GITHUB_REPOSITORY#*/} --notes "${{ inputs.artifact-name }} | sha256 ${{ steps.checksum.outputs.sha256 }} | commit ${{ github.sha }} | verify with -- gh attestation verify ${{ inputs.artifact-name }} --repo ${GITHUB_REPOSITORY} --signer-repo stuttgart-things/github-workflow-templates" --tag ${{ inputs.tag || inputs.artifact-name }} --title "${{ inputs.tag || inputs.artifact-name }}" --files "/tmp/${{ inputs.artifact-name }}" --files "/tmp/${{ inputs.artifact-name }}.sha256" --progress plain
          module: github.com/stuttgart-things/dagger/ansible@${{ inputs.dagger-module-version }}
