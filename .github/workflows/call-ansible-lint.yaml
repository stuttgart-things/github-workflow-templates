---
name: Lint ansible code
on:
  workflow_call:
    inputs:
      runs-on:
        required: true
        type: string
      environment-name:
        default: k8s
        required: true
        type: string
      ansible-image:
        default: ghcr.io/stuttgart-things/sthings-ansible:11.1.0
        type: string
        required: false
      continue-error:
        default: false
        required: true
        type: boolean
      playbook:
        type: string
        required: true

jobs:
  Ansible-Lint:
    runs-on: ${{ inputs.runs-on }}
    container:
      image: ${{ inputs.ansible-image }}
    environment: ${{ inputs.environment-name }}
    continue-on-error: ${{ inputs.continue-error }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ''
          fetch-depth: '0'

      - name: Run ansible lint
        run: |
          ansible-lint --version
          ansible-lint --sarif-file ${{ inputs.playbook }}-lint ${{ inputs.playbook }} || true

      - name: Upload linting results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ansible-lint
          path: ${{ inputs.playbook }}-lint
