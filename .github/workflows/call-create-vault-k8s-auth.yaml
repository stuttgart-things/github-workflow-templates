---
name: Create Vault Kubernetes Auth backend (for ESO) with Dagger
on:
  workflow_call:
    inputs:
      # --- Source / checkout ---
      source-repo:
        description: "Repository containing the SOPS-encrypted kubeconfig + vault env file (owner/repo)"
        required: true
        type: string
      branch-name:
        description: "Git branch to checkout"
        required: false
        type: string
        default: main

      # --- Required ---
      cluster-name:
        description: "Target cluster name (prefixes the Vault auth backend path: <cluster-name>-<auth-name>)"
        required: true
        type: string
      kubeconfig-source-file:
        description: "Path to SOPS-encrypted kubeconfig of the target cluster (relative to source-repo)"
        required: true
        type: string
      vault-env-file:
        description: "Path to SOPS-encrypted Vault env yaml (vaultAddr / vaultToken / vaultSkipVerify)"
        required: true
        type: string

      # --- Optional knobs (defaults match the Dagger function) ---
      auth-name:
        description: "Auth backend + role name; also used as SA / SA-token Secret / CRB name on the cluster"
        required: false
        type: string
        default: "eso"
      namespace:
        description: "Namespace on the target cluster for the SA + SA-token Secret"
        required: false
        type: string
        default: "external-secrets"
      token-policies:
        description: "Comma-separated Vault policies to bind to the role (must pre-exist in Vault)"
        required: false
        type: string
        default: "read-homerun2-pr"
      token-ttl:
        description: "TTL (seconds) for tokens minted via this role"
        required: false
        type: string
        default: "3600"

      # --- Splitting the reviewer from the workload ---
      # Leave all four empty and reviewer == workload == <auth-name>, the shape
      # ESO uses and the previous behaviour of this workflow.
      #
      # Set them when the workload owns its own ServiceAccount and should not be
      # granted system:auth-delegator (the right to TokenReview ANY token in the
      # cluster). cert-manager is the case in point: it logs in as `cert-manager`,
      # created by its Helm chart, so the reviewer belongs somewhere harmless.
      #
      #   reviewer-name:                    vault-auth-reviewer
      #   reviewer-namespace:               kube-system
      #   bound-service-account-names:      cert-manager
      #   bound-service-account-namespaces: cert-manager
      reviewer-name:
        description: "ServiceAccount Vault uses for TokenReview; empty = auth-name"
        required: false
        type: string
        default: ""
      reviewer-namespace:
        description: "Namespace of the reviewer ServiceAccount; empty = namespace"
        required: false
        type: string
        default: ""
      bound-service-account-names:
        description: "Comma-separated ServiceAccounts allowed to log in; empty = auth-name"
        required: false
        type: string
        default: ""
      bound-service-account-namespaces:
        description: "Comma-separated namespaces of those ServiceAccounts; empty = namespace"
        required: false
        type: string
        default: ""

      # --- Runtime / versions ---
      runs-on:
        required: false
        type: string
        default: dagger-labda
      environment-name:
        required: false
        type: string
        default: k8s
      dagger-version:
        required: false
        type: string
        default: "0.21.8"
      argocd-module-version:
        description: "Version of stuttgart-things/blueprints/argocd"
        required: false
        type: string
        # v2.7.0 is the first release carrying --reviewer-name /
        # --bound-service-account-names. On anything older the four inputs above
        # are silently rejected by the module, so they move together.
        default: v2.7.0

permissions:
  contents: read

jobs:
  Create-Vault-K8s-Auth:
    name: Create Vault Kubernetes Auth Backend
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment-name }}
    steps:
      - name: Checkout source repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source-repo }}
          token: ${{ secrets.GH_TOKEN }}
          ref: ${{ inputs.branch-name }}

      - name: Run create-vault-k8s-auth
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        with:
          version: ${{ inputs.dagger-version }}
          verb: call
          module: github.com/stuttgart-things/blueprints/argocd@${{ inputs.argocd-module-version }}
          args: >-
            create-vault-kubernetes-auth
            --cluster-name ${{ inputs.cluster-name }}
            --kubeconfig-source-file ${{ inputs.kubeconfig-source-file }}
            --vault-env-file ${{ inputs.vault-env-file }}
            --sops-key env:SOPS_AGE_KEY
            --auth-name ${{ inputs.auth-name }}
            --namespace ${{ inputs.namespace }}
            --token-policies ${{ inputs.token-policies }}
            --token-ttl ${{ inputs.token-ttl }}
            ${{ inputs.reviewer-name && format('--reviewer-name {0}', inputs.reviewer-name) || '' }}
            ${{ inputs.reviewer-namespace && format('--reviewer-namespace {0}', inputs.reviewer-namespace) || '' }}
            ${{ inputs.bound-service-account-names && format('--bound-service-account-names {0}', inputs.bound-service-account-names) || '' }}
            ${{ inputs.bound-service-account-namespaces && format('--bound-service-account-namespaces {0}', inputs.bound-service-account-namespaces) || '' }}
            --cache-buster ${{ github.run_id }}-${{ github.run_attempt }}
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
