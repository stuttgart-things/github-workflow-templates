---
name: Terraform Vault Execution (cli or dagger executor)
on:
  workflow_call:
    inputs:
      lab:
        description: "Lab identifier (labul, labda)"
        required: true
        type: string
      cluster-name:
        description: "Target cluster name (e.g. philly)"
        required: true
        type: string
      executor:
        description: "How to run terraform (dagger = blueprints TerraformApply, cli = native on runner)"
        required: false
        type: string
        default: dagger
      runs-on:
        required: false
        type: string
        default: dagger-labda
      environment-name:
        required: false
        type: string
        default: k8s
      source-repo:
        description: "Repository containing SOPS secrets + terraform config (owner/repo)"
        required: true
        type: string
      terraform-dir:
        required: false
        type: string
        default: terraform/vault/cluster-issuer
      operation:
        description: "Terraform operation (plan|apply|destroy). plan is CLI-only."
        required: false
        type: string
        default: apply
      branch-name:
        required: false
        type: string
        default: main
      dagger-version:
        required: false
        type: string
        default: "0.21.9"
      blueprints-version:
        required: false
        type: string
        default: v1.82.0
      sops-module-version:
        required: false
        type: string
        default: v0.129.5
      terraform-version:
        required: false
        type: string
        default: "1.14.9"
      # The two files below were env constants until now, which tied this
      # workflow to ONE terraform config: the cert issuer, whose tfvars needs a
      # vaultCaBundle and whose credentials live under the vault-infra-<lab>
      # name. A caller doing anything else in Vault -- a per-cluster KV mount
      # and read policy, say -- needs different values for both.
      #
      # The defaults are exactly what was hardcoded, so every existing caller
      # keeps its current behaviour without naming either input.
      encrypted-env:
        description: SOPS-encrypted file holding the Vault/OpenBao credentials
        required: false
        type: string
        default: ""
      tfvars-template:
        description: Go-template rendered into the terraform dir as tfvars
        required: false
        type: string
        default: secrets/envs/vault-ca-terraform-tfvars.json.tmpl
      # cluster-name has been doing two jobs: naming the cluster to terraform,
      # and locating its kubeconfig. Those disagree in practice -- kubeconfigs
      # are named inconsistently (philly.yaml and cicd-crossplane.yaml carry no
      # lab, labda-cicd-machinery-test5.yaml and labda-sthings-infra.yaml do) --
      # so a caller whose file is prefixed had to pass the prefixed name and
      # got it into every Vault object the config names.
      kubeconfig-file:
        description: SOPS-encrypted kubeconfig path. Empty derives it from cluster-name, as before.
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      lab:
        required: true
        type: choice
        options: [labul, labda]
      cluster-name:
        required: true
        type: string
      executor:
        description: "cli = native terraform on runner, dagger = blueprints TerraformApply inside container"
        required: false
        type: choice
        options: [dagger, cli]
        default: dagger
      source-repo:
        required: true
        type: string
      terraform-dir:
        required: false
        type: string
        default: terraform/vault/cluster-issuer
      operation:
        required: false
        type: choice
        options: [apply, destroy, plan]
        default: apply
      branch-name:
        required: false
        type: string
        default: main

env:
  KUBE_CONFIG_ENC: ${{ inputs.kubeconfig-file != '' && inputs.kubeconfig-file || format('secrets/kubeconfigs/{0}.yaml', inputs.cluster-name) }}
  # `||` on an empty string picks the fallback, so an unset encrypted-env keeps
  # the vault-infra-<lab> name this workflow has always derived.
  ENCRYPTED_ENV: ${{ inputs.encrypted-env != '' && inputs.encrypted-env || format('secrets/envs/vault-infra-{0}.enc.yaml', inputs.lab) }}
  # Same fallback shape, and it is load-bearing: workflow_dispatch does not
  # define these inputs, so a dispatched run reads them as empty and would
  # otherwise render with no template file at all.
  TFVARS_TEMPLATE: ${{ inputs.tfvars-template != '' && inputs.tfvars-template || 'secrets/envs/vault-ca-terraform-tfvars.json.tmpl' }}
  TF_DIR: ${{ inputs.terraform-dir }}
  CONTAINER_KUBECONFIG: /root/.kube/config

jobs:
  Validate-Inputs:
    name: Validate executor/operation combination
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Reject unsupported combinations
        shell: bash
        run: |
          if [[ "${{ inputs.executor }}" == "dagger" && "${{ inputs.operation }}" == "plan" ]]; then
            echo "::error::executor=dagger does not support operation=plan (dagger/terraform Execute has no plan op). Use executor=cli."
            exit 1
          fi

  Terraform-CLI:
    name: Terraform ${{ inputs.operation }} (cli)
    needs: Validate-Inputs
    if: inputs.executor == 'cli'
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment-name }}
    steps:
      - name: Checkout source repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source-repo }}
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: '0'
          ref: ${{ inputs.branch-name }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Setup Dagger CLI
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ inputs.dagger-version }}
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Decrypt kubeconfig + render secrets JSON (silent)
        shell: bash
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -eo pipefail
          dagger call -m github.com/stuttgart-things/dagger/sops@${{ inputs.sops-module-version }} \
            decrypt \
            --age-key env:SOPS_AGE_KEY \
            --encrypted-file "${KUBE_CONFIG_ENC}" \
            export --path /tmp/kubeconfig \
            >/dev/null 2>/tmp/dagger-kubeconfig.err || { echo "::error::kubeconfig decrypt failed"; tail -40 /tmp/dagger-kubeconfig.err; exit 1; }
          chmod 600 /tmp/kubeconfig

          dagger call -m github.com/stuttgart-things/blueprints/configuration@${{ inputs.blueprints-version }} \
            create-secrets-file \
            --age-key env:SOPS_AGE_KEY \
            --encrypted-data-file "${ENCRYPTED_ENV}" \
            --template-file "${TFVARS_TEMPLATE}" \
            --encrypt=false \
            export --path /tmp/rendered-secrets.json \
            >/dev/null 2>/tmp/dagger-render.err || { echo "::error::secrets render failed"; tail -40 /tmp/dagger-render.err; exit 1; }
          chmod 600 /tmp/rendered-secrets.json

      - name: Export VAULT_* env vars + stash CA bundle
        shell: bash
        run: |
          set -eo pipefail
          VT=$(jq -r '.VAULT_TOKEN'       /tmp/rendered-secrets.json)
          VA=$(jq -r '.VAULT_ADDR'        /tmp/rendered-secrets.json)
          VS=$(jq -r '.VAULT_SKIP_VERIFY' /tmp/rendered-secrets.json)
          CA=$(jq -r '.vault_ca_bundle'   /tmp/rendered-secrets.json)
          echo "::add-mask::${VT}"
          echo "::add-mask::${CA}"
          {
            echo "VAULT_TOKEN=${VT}"
            echo "VAULT_ADDR=${VA}"
            echo "VAULT_SKIP_VERIFY=${VS}"
          } >> "$GITHUB_ENV"
          printf '%s' "${CA}" > /tmp/vault_ca_bundle
          chmod 600 /tmp/vault_ca_bundle
          rm -f /tmp/rendered-secrets.json

      - name: Terraform init
        shell: bash
        run: |
          terraform --version
          terraform -chdir="${TF_DIR}" init -upgrade \
            -backend-config="config_path=/tmp/kubeconfig" \
            -backend-config="secret_suffix=${{ inputs.cluster-name }}"

      - name: Terraform ${{ inputs.operation }}
        shell: bash
        run: |
          case "${{ inputs.operation }}" in
            apply|destroy) APPROVE="-auto-approve" ;;
            *)             APPROVE="" ;;
          esac
          # vault_ca_bundle is passed only when there is one. Terraform ERRORS on
          # a -var the root module does not declare, so sending it unconditionally
          # restricts this workflow to configs that take a CA bundle -- i.e. the
          # cert issuer. A config doing something else in Vault, such as a
          # per-cluster KV mount and read policy, has no use for it and fails
          # before it starts.
          #
          # The dagger path already passes only cluster_name and kubeconfig_path,
          # so it never had this limit; this brings the cli path in line rather
          # than adding a new behaviour.
          TF_VARS=(
            -var="cluster_name=${{ inputs.cluster-name }}"
            -var="kubeconfig_path=/tmp/kubeconfig"
            -var="vault_addr=${VAULT_ADDR}"
          )
          if [[ -s /tmp/vault_ca_bundle ]]; then
            TF_VARS+=(-var="vault_ca_bundle=$(cat /tmp/vault_ca_bundle)")
          else
            echo "no vault_ca_bundle in the credentials -- not passing the variable"
          fi

          MAX_ATTEMPTS=3
          ATTEMPT=1
          until terraform -chdir="${TF_DIR}" \
                  ${{ inputs.operation }} \
                  ${APPROVE} \
                  -compact-warnings \
                  "${TF_VARS[@]}"
          do
            if [[ $ATTEMPT -ge $MAX_ATTEMPTS ]]; then
              echo "::error::terraform ${{ inputs.operation }} failed after ${MAX_ATTEMPTS} attempts"
              exit 1
            fi
            echo "::warning::terraform ${{ inputs.operation }} attempt ${ATTEMPT} failed, retrying in 15s..."
            ATTEMPT=$((ATTEMPT + 1))
            sleep 15
          done

      - name: Cleanup runner-local secrets
        if: always()
        shell: bash
        run: rm -f /tmp/kubeconfig /tmp/vault_ca_bundle /tmp/rendered-secrets.json /tmp/dagger-*.err

  Terraform-Dagger:
    name: Terraform ${{ inputs.operation }} (dagger)
    needs: Validate-Inputs
    if: inputs.executor == 'dagger'
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment-name }}
    steps:
      - name: Checkout source repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source-repo }}
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: '0'
          ref: ${{ inputs.branch-name }}

      - name: Render + SOPS-encrypt tfvars JSON into terraform dir
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          AGE_PUB: ${{ secrets.AGE_PUB }}
        with:
          version: ${{ inputs.dagger-version }}
          verb: call
          module: github.com/stuttgart-things/blueprints/configuration@${{ inputs.blueprints-version }}
          args: >-
            create-secrets-file
            --age-key env:SOPS_AGE_KEY
            --age-recipient env:AGE_PUB
            --encrypted-data-file ${{ env.ENCRYPTED_ENV }}
            --template-file ${{ env.TFVARS_TEMPLATE }}
            --encrypt=true
            --file-extension json
            export --path ${{ env.TF_DIR }}/terraform.tfvars.sops.json
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Generate backend_override.tf
        shell: bash
        run: |
          cat > "${TF_DIR}/backend_override.tf" <<EOF
          terraform {
            backend "kubernetes" {
              namespace     = "kube-system"
              config_path   = "${CONTAINER_KUBECONFIG}"
              secret_suffix = "${{ inputs.cluster-name }}"
            }
          }
          EOF

      - name: Terraform ${{ inputs.operation }} via Dagger TerraformApply
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        with:
          version: ${{ inputs.dagger-version }}
          verb: call
          module: github.com/stuttgart-things/blueprints/configuration@${{ inputs.blueprints-version }}
          args: >-
            terraform-apply
            --terraform-dir ${{ env.TF_DIR }}
            --sops-age-key env:SOPS_AGE_KEY
            --encrypted-files terraform.tfvars.sops.json
            --encrypted-kube-config ${{ env.KUBE_CONFIG_ENC }}
            --kube-config-path ${{ env.CONTAINER_KUBECONFIG }}
            --operation ${{ inputs.operation }}
            --variables "cluster_name=${{ inputs.cluster-name }},kubeconfig_path=${{ env.CONTAINER_KUBECONFIG }}"
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
