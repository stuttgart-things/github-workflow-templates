---
# Builds a repository's Backstage TechDocs with the techdocs Dagger module and,
# with publish: true, uploads them to S3/MinIO for a Backstage running
# techdocs.builder: external (see github.com/stuttgart-things/dagger/techdocs).
#
# Call it on pull requests with publish: false -- a broken mkdocs.yml or nav
# then fails the PR instead of showing an empty Docs tab later -- and on main
# with publish: true.
name: TechDocs (Dagger)
on:
  workflow_call:
    inputs:
      runs-on:
        # Self-hosted: the lab MinIO is not reachable from GitHub-hosted runners.
        default: dagger-labda
        type: string
      publish:
        default: false
        type: boolean
        description: "Upload the site; false only builds it (PR check)."
      source-dir:
        default: "."
        type: string
        description: "Directory of mkdocs.yml, relative to the repository root."
      catalog-file:
        default: "catalog-info.yaml"
        type: string
        description: "Catalog file the entity (namespace/kind/name) is read from."
      entity:
        default: ""
        type: string
        description: "<namespace>/<kind>/<name>; overrides catalog-file."
      bucket:
        default: "techdocs"
        type: string
      endpoint:
        default: ""
        type: string
        description: "S3 endpoint, e.g. https://minio.<domain>. Required with publish."
      ca-cert:
        default: ""
        type: string
        description: "PEM CA certificate for an endpoint signed by a private CA (not a secret)."
      dagger-module:
        default: "github.com/stuttgart-things/dagger/techdocs@v0.138.0"
        type: string
      dagger-version:
        default: "0.21.10"
        type: string
    secrets:
      TECHDOCS_S3_ACCESS_KEY:
        required: false
      TECHDOCS_S3_SECRET_KEY:
        required: false

permissions:
  contents: read

jobs:
  techdocs:
    name: TechDocs ${{ inputs.publish && 'build + publish' || 'build' }}
    runs-on: ${{ inputs.runs-on }}
    env:
      MODULE: ${{ inputs.dagger-module }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | BIN_DIR=$HOME/.local/bin DAGGER_VERSION="${{ inputs.dagger-version }}" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Which path Backstage will read the docs under. Resolved on PRs too, so
      # a catalog-info.yaml without (or with two) techdocs-ref fails early.
      - name: Entity
        id: entity
        env:
          ENTITY: ${{ inputs.entity }}
          CATALOG_FILE: ${{ inputs.catalog-file }}
        run: |
          set -euo pipefail
          if [[ -z "$ENTITY" ]]; then
            ENTITY=$(dagger call -m "$MODULE" entity --src . --catalog-file "$CATALOG_FILE" | tr -d '[:space:]')
          fi
          echo "entity=$ENTITY" >> "$GITHUB_OUTPUT"
          echo "Entity: $ENTITY"

      - name: Build
        env:
          SOURCE_DIR: ${{ inputs.source-dir }}
        run: |
          set -euo pipefail
          dagger call -m "$MODULE" generate --src . --source-dir "$SOURCE_DIR" \
            export --path ./techdocs-site
          test -f ./techdocs-site/techdocs_metadata.json

      # Uploads the site the Build step exported: built once, published as
      # built.
      - name: Publish
        if: ${{ inputs.publish }}
        env:
          TECHDOCS_S3_ACCESS_KEY: ${{ secrets.TECHDOCS_S3_ACCESS_KEY }}
          TECHDOCS_S3_SECRET_KEY: ${{ secrets.TECHDOCS_S3_SECRET_KEY }}
          ENTITY: ${{ steps.entity.outputs.entity }}
          BUCKET: ${{ inputs.bucket }}
          ENDPOINT: ${{ inputs.endpoint }}
          CA_CERT: ${{ inputs.ca-cert }}
        run: |
          set -euo pipefail
          [[ -n "$ENDPOINT" ]] || { echo "::error::publish needs inputs.endpoint"; exit 1; }
          [[ -n "$TECHDOCS_S3_ACCESS_KEY" && -n "$TECHDOCS_S3_SECRET_KEY" ]] \
            || { echo "::error::publish needs secrets TECHDOCS_S3_ACCESS_KEY and TECHDOCS_S3_SECRET_KEY"; exit 1; }

          ca_args=()
          if [[ -n "$CA_CERT" ]]; then
            printf '%s\n' "$CA_CERT" > "$RUNNER_TEMP/techdocs-ca.crt"
            ca_args=(--ca-cert "$RUNNER_TEMP/techdocs-ca.crt")
          fi

          dagger call -m "$MODULE" publish \
            --site ./techdocs-site \
            --entity "$ENTITY" \
            --bucket "$BUCKET" \
            --endpoint "$ENDPOINT" \
            --access-key env:TECHDOCS_S3_ACCESS_KEY \
            --secret-key env:TECHDOCS_S3_SECRET_KEY \
            "${ca_args[@]}"
