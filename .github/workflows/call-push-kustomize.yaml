---
name: Push Kustomize OCI Base
on:
  workflow_call:
    inputs:
      runs-on:
        default: ubuntu-latest
        type: string
      kcl-source-dir:
        default: kcl
        type: string
        description: "KCL source directory (passed as --source)"
      kcl-profile-file:
        default: tests/kcl-deploy-profile.yaml
        type: string
        description: "KCL profile file (passed as --parameters-file)"
      kcl-parameters:
        default: ""
        type: string
        description: >-
          Comma-separated key=value overrides, passed as --parameters. They win
          over the profile file, which is what makes a per-build value possible
          at all: an image reference belongs to the artefact being published,
          not to a profile committed weeks earlier. Omitted from the call when
          empty, so existing callers are unaffected.
      kustomize-oci-repo:
        required: true
        type: string
        description: "OCI repo to push, e.g. ghcr.io/<org>/<repo>-kustomize"
      tag:
        required: true
        type: string
        description: "Tag to push, e.g. pr-42-abc1234 or v1.2.3"
      ref:
        default: ""
        type: string
        description: >-
          Commit, branch or tag to render from. Empty takes checkout's default,
          which on a pull_request is the merge commit GitHub builds — not the
          head. A caller that names its artefact after `head_sha` has to pass
          that head_sha here, or it publishes a tag that does not identify what
          it built.
      additional-tags:
        default: ""
        type: string
        description: >-
          Comma-separated extra tags, applied with `oras tag` to the digest just
          pushed rather than by publishing again. That distinction is the whole
          point: a second publish re-renders the base and oras stamps a fresh
          created annotation, so the two tags land on two different digests and
          both report success while disagreeing. Typically "latest".
      oras-version:
        default: "1.2.2"
        type: string
        description: >-
          Kept at the version the kcl module installs, so a tag written here and
          an artefact pushed there cannot come from two different oras.
      dagger-kcl-module:
        default: github.com/stuttgart-things/dagger/kcl@v0.129.5
        type: string
      dagger-version:
        default: "0.21.9"
        type: string
    outputs:
      artifact-ref:
        description: "Fully-qualified pushed kustomize OCI artifact reference"
        value: ${{ jobs.push.outputs.artifact-ref }}

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  push:
    name: Push kustomize base via Dagger
    runs-on: ${{ inputs.runs-on }}
    outputs:
      artifact-ref: ${{ steps.ref.outputs.artifact-ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty on push and workflow_dispatch, where checkout takes its own
          # default. It matters on a pull request: the source rendered here may
          # be exactly what the pull request changes, so the artefact has to
          # come from the commit its tag names.
          ref: ${{ inputs.ref }}

      - name: Push kustomize base
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ inputs.dagger-version }}
          module: ${{ inputs.dagger-kcl-module }}
          call: >-
            push-kustomize-base
            --source ./${{ inputs.kcl-source-dir }}
            --parameters-file ./${{ inputs.kcl-profile-file }}
            ${{ inputs.kcl-parameters != '' && format('--parameters {0}', inputs.kcl-parameters) || '' }}
            --address ${{ inputs.kustomize-oci-repo }}
            --tag ${{ inputs.tag }}
            --user env:GITHUB_USER
            --password env:GITHUB_TOKEN
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve artifact ref
        id: ref
        run: |
          REF="${{ inputs.kustomize-oci-repo }}:${{ inputs.tag }}"
          echo "artifact-ref=${REF}" >> "$GITHUB_OUTPUT"

      # The push itself proves nothing about the artifact's usefulness: a
      # ConfigMap whose embedded YAML got folded onto one line is still a
      # valid manifest and pushes green. Pull it back and parse it.
      - name: Verify the pushed base
        uses: stuttgart-things/github-workflow-templates/actions/verify-kustomize-base@0d4c5b00e327d24698daf1e696a4f8eab2fc0175 # main
        with:
          artifact-ref: ${{ steps.ref.outputs.artifact-ref }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

      # A tag on what was just pushed, never a second publish. Both times this
      # drifted in a consuming repository it was invisible until somebody
      # compared digests by hand, and both tags reported success while
      # disagreeing — so the agreement is proved here rather than assumed.
      - name: Apply additional tags
        if: inputs.additional-tags != ''
        env:
          ORAS_VERSION: ${{ inputs.oras-version }}
          REPO: ${{ inputs.kustomize-oci-repo }}
          TAG: ${{ inputs.tag }}
          EXTRA: ${{ inputs.additional-tags }}
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C "${RUNNER_TEMP}/bin" oras
          export PATH="${RUNNER_TEMP}/bin:${PATH}"

          printenv GITHUB_TOKEN \
            | oras login "${REPO%%/*}" --username "${GITHUB_USER}" --password-stdin

          digest() {
            oras manifest fetch --descriptor "$1" \
              | sed 's/.*"digest":"\([^"]*\)".*/\1/'
          }

          pushed="$(digest "${REPO}:${TAG}")"

          # Split without a pipe: an `exit 1` inside `… | while read` only
          # leaves the subshell, and whether that fails the step then depends
          # on pipefail being set. This does not depend on anything.
          IFS=',' read -ra extra <<< "${EXTRA}"

          for t in "${extra[@]}"; do
            t="${t//[[:space:]]/}"
            [ -n "${t}" ] || continue

            oras tag "${REPO}:${TAG}" "${t}"

            got="$(digest "${REPO}:${t}")"
            if [ "${got}" != "${pushed}" ]; then
              echo "${REPO}: ${t} is ${got}, ${TAG} is ${pushed} — the tags do not identify the same artefact" >&2
              exit 1
            fi
            echo "${REPO}: ${t} and ${TAG} agree on ${pushed}"
          done

      - name: Summary
        run: |
          {
            echo "## Kustomize OCI Push"
            echo ""
            echo "**Artifact:** \`${{ steps.ref.outputs.artifact-ref }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
