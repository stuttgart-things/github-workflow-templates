---
name: Repository Linting
on:
  workflow_call:
    inputs:
      runs-on:
        required: false
        type: string
        default: ubuntu-latest
      app-directory:
        required: false
        type: string
        default: "./"
      output-file:
        required: false
        type: string
        default: "/tmp/repo-findings.txt"
      continue-error:
        required: false
        type: string
        default: "true"
      branch-name:
        required: false
        type: string
        default: main
      dagger-version:
        description: >-
          Dagger CLI/engine version. Must be >= 0.19.11 on ubuntu-latest
          (Ubuntu 26.04, kernel 7.x): older engines force iptables-legacy and
          crash-loop when the legacy nat table is not available (dagger/dagger#11607).
        required: false
        type: string
        default: "0.21.10"
      engine-start-timeout:
        description: "Seconds to wait for the Dagger engine to come up before failing"
        required: false
        type: number
        default: 180
      dagger-module-version:
        required: false
        type: string
        # renovate: datasource=github-releases depName=stuttgart-things/blueprints
        default: v3.11.0
      environment-name:
        required: false
        type: string
        default: linting
      yaml-config-path:
        required: false
        type: string
        default: ".yamllint"
      yaml-output-file:
        required: false
        type: string
        default: "yamllint-findings.txt"
      markdown-config-path:
        required: false
        type: string
        default: ".mdlrc"
      markdown-output-file:
        required: false
        type: string
        default: "markdown-findings.txt"
      merged-output-file:
        required: false
        type: string
        default: "all-findings.txt"
      artifact-retention-days:
        required: false
        type: number
        default: 30

permissions:
  contents: read

jobs:
  lint-repository:
    name: Repository Linting
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch-name }}

      - name: Install Dagger CLI
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ inputs.dagger-version }}

      # Dagger engines < v0.19.11 hard-code iptables-legacy. On kernels where the
      # legacy nat table is not loaded (ubuntu-latest = Ubuntu 26.04, kernel 7.x)
      # the engine exits with "can't initialize iptables table `nat'" and Docker
      # restarts it forever, so the CLI waits 10 min for engine.sock and fails.
      # v0.19.11+ detects this and switches to nftables (dagger/dagger#11731).
      - name: Check Dagger engine compatibility
        env:
          DAGGER_VERSION_INPUT: ${{ inputs.dagger-version }}
        run: |
          MIN_VERSION="0.19.11"
          REQUESTED="${DAGGER_VERSION_INPUT#v}"
          if [ "$REQUESTED" = "latest" ] || [ -z "$REQUESTED" ]; then
            exit 0
          fi
          OLDEST="$(printf '%s\n%s\n' "$REQUESTED" "$MIN_VERSION" | sort -V | head -n1)"
          if [ "$OLDEST" = "$MIN_VERSION" ]; then
            echo "Dagger ${REQUESTED} >= ${MIN_VERSION}: nftables fallback available"
            exit 0
          fi

          echo "::warning title=Outdated dagger-version::dagger-version ${REQUESTED} is older than ${MIN_VERSION} and only works on hosts with legacy iptables (e.g. ubuntu-24.04). Drop the dagger-version override or raise it to >= ${MIN_VERSION}. See stuttgart-things/github-workflow-templates#226."

          # Best effort: load the legacy xtables modules on the host so the old
          # engine can still find its nat table.
          if [ ! -e /proc/net/ip_tables_names ]; then
            sudo modprobe -a ip_tables iptable_nat iptable_filter 2>&1 || true
          fi
          if [ ! -e /proc/net/ip_tables_names ]; then
            echo "::error title=Dagger engine will not start::Legacy iptables is not available on this runner ($(uname -r)) and dagger ${REQUESTED} < ${MIN_VERSION} cannot fall back to nftables. Set dagger-version >= ${MIN_VERSION} (template default: 0.21.10)."
            exit 1
          fi

      - name: Start Dagger engine
        env:
          ENGINE_START_TIMEOUT: ${{ inputs.engine-start-timeout }}
        run: |
          if ! timeout "${ENGINE_START_TIMEOUT}" dagger --progress plain core version; then
            echo "::error title=Dagger engine did not start::Engine not ready after ${ENGINE_START_TIMEOUT}s"
            docker ps -a --filter name=dagger-engine
            for c in $(docker ps -a --filter name=dagger-engine --format '{{.Names}}'); do
              echo "::group::docker logs ${c}"
              docker logs --tail 50 "${c}" 2>&1 | grep -v '^dnsmasq' || true
              echo "::endgroup::"
            done
            exit 1
          fi

      - name: Run repository linting
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ inputs.dagger-version }}
          verb: call
          module: github.com/stuttgart-things/blueprints/repository-linting@${{ inputs.dagger-module-version }}
          args: >-
            validate-multiple-technologies
            --src ${{ inputs.app-directory }}
            --yaml-config-path ${{ inputs.yaml-config-path }}
            --yaml-output-file ${{ inputs.yaml-output-file }}
            --markdown-config-path ${{ inputs.markdown-config-path }}
            --markdown-output-file ${{ inputs.markdown-output-file }}
            --merged-output-file ${{ inputs.merged-output-file }}
            export --path ${{ inputs.output-file }}

      - name: Display linting results
        if: always()
        run: |
          if [ -f ${{ inputs.output-file }} ]; then
            echo "==> Repository Linting Results"
            cat ${{ inputs.output-file }}

            # Check if there are any findings
            if [ -s ${{ inputs.output-file }} ]; then
              echo ""
              echo "⚠️  Linting findings detected. Please review the output above."
            else
              echo "✅ No linting issues found"
            fi
          else
            echo "❌ Linting output file not found"
            exit 1
          fi

      - name: Upload linting results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linting-results
          path: ${{ inputs.output-file }}
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Add results to summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## 🔍 Repository Linting Results

          EOF

          if [ -f ${{ inputs.output-file }} ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat ${{ inputs.output-file }} >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo '❌ No results file generated' >> $GITHUB_STEP_SUMMARY
          fi
